name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "deploy/terraform/**"
      - ".github/scripts/check-stage-files.sh"
      - ".github/workflows/terraform.yml"
  # Unfiltered: a workflow skipped by a paths filter leaves its checks pending, so a
  # required `validate` would block the merge:
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  pull_request:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.1"

      - name: Format check
        run: terraform -chdir=deploy/terraform fmt -check -recursive

      - name: Validate (root stack)
        run: |
          terraform -chdir=deploy/terraform init -backend=false
          terraform -chdir=deploy/terraform validate

      # Plans each kind of environment against mock providers (no credentials).
      - name: Test (root stack)
        run: terraform -chdir=deploy/terraform test

      # The real stages/*.tfvars: no undeclared setting, and each plans offline.
      - name: Check the stage files
        run: bash .github/scripts/check-stage-files.sh

      - name: Validate (bootstrap stack)
        run: |
          terraform -chdir=deploy/terraform/bootstrap init -backend=false
          terraform -chdir=deploy/terraform/bootstrap validate

      # Renders the stages' IAM with fake credentials (no AWS calls).
      - name: Test (bootstrap stack)
        run: terraform -chdir=deploy/terraform/bootstrap test
