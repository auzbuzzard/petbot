name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # Pinned to an immutable commit SHA — setup-uv stopped publishing moving
        # major/minor tags at v8.0.0 (anti supply-chain), so `@v8` cannot resolve.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Sync (all extras)
        # --locked fails if uv.lock is stale; uv itself fetches/pins Python 3.12.
        # One package, so --all-extras installs everything (edge, worker, lambda, dev).
        run: uv sync --locked --all-extras --python 3.12

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Import-linter (boundaries)
        run: uv run lint-imports

      - name: Pytest
        # No secrets needed: every test is offline (mocked APIs, no Discord login).
        run: uv run pytest
