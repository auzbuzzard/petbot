name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync (workspace members + all extras)
        run: uv sync --all-extras --all-packages

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Import-linter (boundaries)
        run: uv run lint-imports

      - name: Pytest
        # No secrets needed: every test is offline (mocked APIs, no Discord login).
        run: uv run pytest
