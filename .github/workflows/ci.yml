name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # Pinned to an immutable commit SHA — setup-uv stopped publishing moving
        # major/minor tags at v8.0.0 (anti supply-chain), so `@v8` cannot resolve.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Sync (all extras)
        # --locked fails if uv.lock is stale; uv itself fetches/pins Python 3.12.
        # One package, so --all-extras installs everything (edge, worker, lambda, dev).
        run: uv sync --locked --all-extras --python 3.12

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Import-linter (boundaries)
        run: uv run lint-imports

      - name: Pytest
        # No secrets needed: every test is offline (mocked APIs, no Discord login).
        run: uv run pytest
