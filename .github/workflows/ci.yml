name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Workspace members (ADR 0006). Editable so mypy/pytest see the source.
          pip install -e ./domain

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Import-linter (core/adapter boundary)
        run: lint-imports

      - name: Pytest
        # No secrets needed: every test is offline (mocked APIs, no Discord login).
        run: pytest
