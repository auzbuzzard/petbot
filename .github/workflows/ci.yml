name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync (workspace members + all extras)
        # uv fetches/pins Python 3.12 itself (requires-python >=3.12).
        run: uv sync --all-extras --all-packages --python 3.12

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Import-linter (boundaries)
        run: uv run lint-imports

      - name: Pytest
        # No secrets needed: every test is offline (mocked APIs, no Discord login).
        run: uv run pytest
