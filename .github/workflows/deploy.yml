name: Deploy

# Build + push the core worker image (arm64) and the edge image (amd64) to ECR,
# then terraform apply — entirely from CI via GitHub OIDC (no static AWS keys).
# The Lightsail edge pulls its image from ECR (private-registry access). See
# deploy/terraform/README.md. The deploy role trusts only jobs in the `production`
# environment (which admits only main); the root of trust itself is applied by
# bootstrap.yml. Actions are pinned to commit SHAs: this job holds AWS credentials.
on:
  workflow_dispatch:
  push:
    branches: [main]

# OIDC: request a short-lived token to assume the AWS deploy role.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # arm64 runner matches the worker Lambda's Graviton architecture, so that
    # image builds natively; the smaller edge image cross-builds for amd64 via
    # QEMU (cheaper to emulate than the heavy worker image).
    runs-on: ubuntu-24.04-arm
    # The deploy role's trust names this environment; the environment admits only
    # main and needs a required reviewer's approval, so a merge alone ships nothing.
    environment: production
    env:
      TF_DIR: deploy/terraform
      # Deploy config, read by Terraform as TF_VAR_*; secret *values* stay in SSM,
      # referenced by name. AWS_REGION is a repository variable (bootstrap.yml reads it
      # too); the rest are the `production` environment's. The state bucket and the role
      # ARN carry the account ID, so they are read as secrets, which the public log masks;
      # a variable of the same name stands in while no secret is set, unmasked.
      # Job-level, because only a job that references an environment sees its variables.
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_chat_llm_kind: ${{ vars.CHAT_LLM_KIND }}
      TF_VAR_chat_llm_model: ${{ vars.CHAT_LLM_MODEL }}
      TF_VAR_chat_llm_base_url: ${{ vars.CHAT_LLM_BASE_URL }}
      TF_VAR_chat_llm_api_key_ssm_parameter: ${{ vars.CHAT_LLM_API_KEY_SSM_PARAMETER }}
      # Optional: the web_search tool's Tavily key (unset => keyless ddgs search only).
      TF_VAR_tavily_api_key_ssm_parameter: ${{ vars.TAVILY_API_KEY_SSM_PARAMETER }}
      # Observability (off unless OBSERVABILITY_ENABLED is set to "true"). The `|| 'default'`
      # fallbacks matter: an unset GitHub Variable renders as an empty string, and Terraform
      # would reject "" for a bool/number var — so an unset Variable resolves to the
      # variable's default.
      TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED || 'false' }}
      TF_VAR_observability_sample_ratio: ${{ vars.OBSERVABILITY_SAMPLE_RATIO || '1.0' }}
      TF_VAR_telemetry_id_salt_ssm_parameter: ${{ vars.TELEMETRY_ID_SALT_SSM_PARAMETER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN || vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # The log is public: mask the account ID in every ARN, URL and name after this.
          mask-aws-account-id: true

      # buildx for the gha layer cache; QEMU for the amd64 edge build on arm.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"

      - name: Image tag (short git SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}" \
            -backend-config="key=petbot/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # The function is pinned to its image digest, and the edge service must grant
      # ECR-pull access before the deployment is created — so stand up the two ECR
      # repos, the Lightsail service, and the edge repo policy first (idempotent).
      - name: Ensure registries + edge service exist
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.this \
            -target=aws_ecr_repository.edge \
            -target=aws_lightsail_container_service.edge \
            -target=aws_ecr_repository_policy.edge
          echo "ECR_REPO=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"
          echo "EDGE_ECR_REPO=$(terraform output -raw edge_ecr_repository_url)" >> "$GITHUB_ENV"

      - name: ECR login
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"

      - name: Build & push core worker image (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.lambda
          platforms: linux/arm64
          tags: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          push: true
          # provenance=false: buildx otherwise pushes an OCI image *index*, which
          # Lambda rejects; this pushes a single image manifest Lambda accepts.
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build & push edge image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.edge
          platforms: linux/amd64
          tags: ${{ env.EDGE_ECR_REPO }}:${{ env.IMAGE_TAG }}
          push: true
          provenance: false
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var "image_tag=$IMAGE_TAG" \
            -var "edge_image_tag=$IMAGE_TAG"

      - name: Show outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform output -raw core_function_arn; echo
          terraform output -raw edge_container_service_name; echo
