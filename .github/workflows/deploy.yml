name: Deploy

# The one pipeline for the root of trust (deploy/terraform/bootstrap) and both stages
# (deploy/terraform), entirely from CI via GitHub OIDC (no static AWS keys). Every CI role
# trusts only this file (bootstrap's github_trust). See deploy/terraform/README.md.
#
# - A pull request from this repository: bootstrap is planned with its read-only role and
#   the plan's digest posted to the pull request's head commit; the change deploys to `dev`,
#   that commit's core alone (no edge), into its own stack with its own deploy role, and the
#   `test` job runs the regression suite (tests/regression) against it (docs/adr/0014).
# - A merge (a push to main): bootstrap applies the plan its pull request showed, and no
#   other; then `production` deploys, from main only.
# - A manual run deploys the stage it names and leaves bootstrap alone.
#
# Each stage's settings are code (deploy/terraform/stages/<stage>.tfvars). Actions are pinned
# to commit SHAs: these jobs hold AWS credentials. The log is public like the repository: the
# state bucket and the role ARNs carry the account ID, so they are read as secrets (a
# variable of the same name stands in, unmasked, while no secret is set), and the credentials
# step masks it everywhere after. No plan file or state leaves the runner.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy: production (main only) or dev (any branch, core only)."
        type: choice
        options: [production, dev]
        default: production
      rotate_edge_key:
        description: Replace the edge's AWS access key now, instead of on its schedule
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

# One run per environment at a time, held from bootstrap to deploy to test, so no other run
# lands between a run's steps. A group keeps one waiting run and cancels an older waiting
# one, so a fork's or Dependabot's pull request, which never deploys, gets a group of its
# own (supersede.yml cancels an older run still waiting for an approval):
# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && (github.event.pull_request.head.repo.full_name != github.repository
            || github.actor == 'dependabot[bot]')
        && format('deploy-untrusted-{0}', github.run_id)
        || format('deploy-{0}', inputs.environment || (github.event_name == 'pull_request' && 'dev' || 'production')) }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # AWS_REGION is a repository variable; TF_STATE_BUCKET a repository secret.
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}

jobs:
  untrusted:
    if: >-
      github.event_name == 'pull_request'
      && (github.event.pull_request.head.repo.full_name != github.repository
          || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Live tests skipped. A pull request from a fork or Dependabot can't reach AWS; a maintainer's branch is tested on the dev core."

  # Bootstrap's plan for this pull request, with the read-only role: the full plan in the
  # log, its resource changes in the summary, and its digest (of the resource changes) as
  # the head commit's bootstrap-plan/digest status. It takes no lock and writes nothing.
  bootstrap-plan:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: bootstrap-plan
    permissions:
      contents: read
      id-token: write
      statuses: write
    defaults:
      run:
        working-directory: deploy/terraform/bootstrap
    env:
      TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.BOOTSTRAP_PLAN_ROLE_ARN || vars.BOOTSTRAP_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Terraform plan
        id: plan
        run: |
          bash ../../../.github/scripts/bootstrap-plan.sh -lock=false
          {
            echo "## Bootstrap plan"
            echo "Digest: \`$(cat plan.digest)\`. Merging applies this plan, and no other."
            echo
            echo "The full plan is in the **Terraform plan** step's log."
            echo
            cat plan.resources
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$(cat plan.digest)" >> "$GITHUB_OUTPUT"

      - name: Post the digest to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIGEST: ${{ steps.plan.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success -f context=bootstrap-plan/digest \
            -f description="$DIGEST" -f target_url="$RUN_URL" > /dev/null

  # A merge's bootstrap change: plan again under the state lock and apply only if that plan
  # is the one its pull request showed (same digest). If anything changed since (the state,
  # the account), re-run the pull request's bootstrap-plan job, read the new plan, then
  # re-run this job.
  bootstrap:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: bootstrap
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      statuses: read
    defaults:
      run:
        working-directory: deploy/terraform/bootstrap
    env:
      TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
      APPLY_ROLE_ARN: ${{ secrets.BOOTSTRAP_APPLY_ROLE_ARN || vars.BOOTSTRAP_APPLY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Terraform apply (the plan its pull request showed)
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ../../../.github/scripts/bootstrap-plan.sh -lock-timeout=120s
          if [ "$(cat plan.changes)" = false ]; then
            echo "Bootstrap has no changes."
            exit 0
          fi
          digest=$(cat plan.digest)
          reviewed=$(bash ../../../.github/scripts/reviewed-bootstrap-digest.sh)
          if [ "$digest" != "$reviewed" ]; then
            echo "::error::This plan (${digest}) is not the one the pull request showed (${reviewed:-none}). Re-run the pull request's bootstrap-plan job, read its plan, then re-run this job."
            exit 1
          fi
          terraform apply -no-color -lock-timeout=120s bootstrap.tfplan
          echo "applied=true" >> "$GITHUB_OUTPUT"

      # The apply may have changed the trust this job assumed its role with; the next merge
      # assumes it the same way, so check now, with a new token (IAM is eventually consistent).
      - name: The apply role still trusts this job
        if: steps.apply.outputs.applied == 'true'
        run: |
          for attempt in $(seq 1 12); do
            token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
            if aws sts assume-role-with-web-identity --role-arn "$APPLY_ROLE_ARN" \
                --role-session-name trust-check --web-identity-token "$token" \
                --query 'Credentials.Expiration' --output text > /dev/null; then
              echo "The apply role trusts this job."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::The apply role no longer trusts this workflow's job on main: the next bootstrap change can't apply. Fix its trust (main.tf's github_trust) from a session that still holds it, or re-seed."
          exit 1

  deploy:
    needs: bootstrap
    if: >-
      !cancelled()
      && (github.event_name == 'push' && needs.bootstrap.result == 'success'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]'))
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      # The core image this run built, which the test job checks is what dev runs.
      worker_digest: ${{ steps.worker.outputs.digest }}
    permissions:
      contents: read
      id-token: write
    # arm64 runner matches the worker Lambda's Graviton architecture, so that
    # image builds natively; the smaller edge image cross-builds for amd64 via
    # QEMU (cheaper to emulate than the heavy worker image).
    runs-on: ubuntu-24.04-arm
    # Each deploy role's trust names its environment. `dev` is created by the first run that
    # references it, with no rules.
    environment: ${{ inputs.environment || (github.event_name == 'pull_request' && 'dev' || 'production') }}
    env:
      TF_DIR: deploy/terraform
      DEPLOY_ENV: ${{ inputs.environment || (github.event_name == 'pull_request' && 'dev' || 'production') }}
      # build-push-action otherwise uploads each build's record as a run artifact and writes
      # a build summary, both naming the ECR image, whose host carries the account ID; the
      # log is masked, but an artifact is not, and the repository is public.
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each environment's stage: its resource prefix and deploy role (bootstrap's
      # var.environments names the same), its state and its settings file. Terraform reads
      # the settings for every command through TF_CLI_ARGS_<command>.
      - name: Stage
        id: stage
        run: |
          case "$DEPLOY_ENV" in
            production) stage=prod ;;
            dev) stage=dev ;;
            *) echo "::error::Unknown environment: $DEPLOY_ENV"; exit 1 ;;
          esac
          {
            echo "STAGE=$stage"
            echo "TF_STATE_KEY=petbot-$stage/terraform.tfstate"
            echo "TF_VAR_name_prefix=petbot-$stage"
            echo "TF_CLI_ARGS_apply=-var-file=stages/$stage.tfvars"
            echo "TF_CLI_ARGS_console=-var-file=stages/$stage.tfvars"
          } >> "$GITHUB_ENV"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Deploy role
        env:
          ROLE_ARN_SECRET: ${{ secrets.DEPLOY_ROLE_ARN }}
        run: bash .github/scripts/deploy-role.sh "petbot-github-deploy-$STAGE"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          # The log is public: mask the account ID in every ARN, URL and name after this.
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Image tag (short git SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Edge
        working-directory: ${{ env.TF_DIR }}
        run: echo "EDGE=$(echo 'var.edge_enabled' | terraform console)" >> "$GITHUB_ENV"

      # A stage's own parameters that already exist read themselves rather than the
      # parameter they were copied from (parameters.tf), so a deleted source can't break a
      # later deploy. Names only: no value is read here.
      - name: Existing owned parameters
        working-directory: ${{ env.TF_DIR }}
        run: |
          names=$(echo 'join(",", keys(var.ssm_parameters))' | terraform console | tr -d '"')
          existing="[]"
          if [ -n "$names" ]; then
            existing=$(aws ssm describe-parameters \
              --parameter-filters "Key=Name,Option=Equals,Values=$names" \
              --query 'Parameters[].Name' --output json)
          fi
          echo "TF_VAR_existing_ssm_parameters=$(jq -c . <<< "$existing")" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.EDGE == 'true'

      # The function is pinned to its image digest, and the edge service must grant
      # ECR-pull access before the deployment is created — so stand up the two ECR
      # repos, the Lightsail service, and the edge repo policy first (idempotent). A stack
      # without the edge needs only the core's repo.
      - name: Ensure registries + edge service exist
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "$EDGE" = true ]; then
            terraform apply -auto-approve \
              -target=aws_ecr_repository.this \
              -target=aws_ecr_repository.edge \
              -target=aws_lightsail_container_service.edge \
              -target=aws_ecr_repository_policy.edge
            echo "EDGE_ECR_REPO=$(terraform output -raw edge_ecr_repository_url)" >> "$GITHUB_ENV"
          else
            terraform apply -auto-approve -target=aws_ecr_repository.this
          fi
          echo "ECR_REPO=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"

      - name: ECR login
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"

      - name: Build & push core worker image (arm64)
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.lambda
          platforms: linux/arm64
          tags: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          push: true
          # provenance=false: buildx otherwise pushes an OCI image *index*, which
          # Lambda rejects; this pushes a single image manifest Lambda accepts.
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build & push edge image (amd64)
        if: env.EDGE == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.edge
          platforms: linux/amd64
          tags: ${{ env.EDGE_ECR_REPO }}:${{ env.IMAGE_TAG }}
          push: true
          provenance: false
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

      # Terraform prints each resource's id as it refreshes or creates it, and the edge's
      # access key id is one; the log is public, so access key ids are redacted from it.
      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          # Empty on a push, so a push never rotates; see edge.tf for the replacement order.
          ROTATE_EDGE_KEY: ${{ inputs.rotate_edge_key }}
        run: |
          set -o pipefail
          echo "EDGE_LOG_SINCE=$(date -u +%s)" >> "$GITHUB_ENV"
          replace=()
          if [ "$ROTATE_EDGE_KEY" = "true" ]; then
            if [ "$EDGE" != true ]; then
              echo "::error::rotate_edge_key: the $STAGE stage runs no edge, so it has no edge key to replace."
              exit 1
            fi
            replace=(-replace='aws_iam_access_key.edge[0]')
          fi
          terraform apply -auto-approve "${replace[@]}" \
            -var "image_tag=$IMAGE_TAG" \
            -var "edge_image_tag=$IMAGE_TAG" 2>&1 \
            | sed -u -E 's/(AKIA|ASIA)[A-Z0-9]{16}/\1****************/g'

      - name: The core runs this run's image
        working-directory: ${{ env.TF_DIR }}
        env:
          EXPECTED: ${{ steps.worker.outputs.digest }}
        run: |
          function=$(terraform output -raw core_function_name)
          running=$(aws lambda get-function --function-name "$function" \
            --query 'Code.ResolvedImageUri' --output text)
          running="${running##*@}"
          if [ -z "$EXPECTED" ] || [ "$running" != "$EXPECTED" ]; then
            echo "::error::$function runs $running, not this run's image ($EXPECTED)."
            exit 1
          fi
          echo "$function runs this run's image ($running)."

      - name: Keyless probe (edge)
        if: env.EDGE == 'true'
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: |
          service=$(terraform output -raw edge_container_service_name)
          # Every page of the log since the apply, searched here: GetContainerLog's docs don't
          # say how filterPattern treats a hyphen, and botocore has no paginator for it.
          # https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_GetContainerLog.html
          edge_log() {
            local page token
            local args=()
            for _ in $(seq 1 100); do
              page=$(aws lightsail get-container-log --service-name "$service" --container-name edge \
                --start-time "$EDGE_LOG_SINCE" "${args[@]}" --output json)
              jq -r '.logEvents[].message' <<< "$page"
              token=$(jq -r '.nextPageToken // empty' <<< "$page")
              [ -n "$token" ] || return 0
              args=(--page-token "$token")
            done
          }
          seen=""
          for _ in $(seq 1 20); do
            log=$(edge_log)
            lines=$(grep -o 'keyless-probe: .*' <<< "$log" || true)
            if [ -n "$lines" ] && [ "$lines" = "$seen" ]; then
              echo "$lines"
              exit 0
            fi
            seen=$lines
            sleep 15
          done
          [ -z "$seen" ] || echo "$seen"
          echo "::warning::The keyless-probe lines didn't settle: $(grep -c . <<< "$log" || true) log lines since the apply, $(grep -c 'Starting PetBot Discord frontend' <<< "$log" || true) of them the frontend starting."

  # Every deploy to dev (each pull request from this repository, or a manual dev run) is
  # tested live: the regression suite (tests/regression) runs against petbot-dev-core,
  # dispatched as the Discord frontend dispatches, as the dev deploy role, and grades the
  # tool calls the core reports (dev.tfvars' report_trajectory). Its result is this job's
  # check on the pull request, and each case's results go to the run's summary. The run
  # holds the dev slot from deploy to here (the workflow's concurrency group), and the
  # first step proves the function runs this run's image, so the tests can't run against
  # another deploy.
  test:
    needs: deploy
    # !cancelled(): without a status check, the bootstrap job a pull request skips would
    # skip this one too.
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.deploy.outputs.stage == 'dev' }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      PETBOT_REGRESSION_FUNCTION: petbot-dev-core
      PETBOT_REGRESSION_SUMMARY: regression-summary.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy role
        env:
          ROLE_ARN_SECRET: ${{ secrets.DEPLOY_ROLE_ARN }}
        run: bash .github/scripts/deploy-role.sh petbot-github-deploy-dev

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: The dev core runs this run's image
        env:
          EXPECTED: ${{ needs.deploy.outputs.worker_digest }}
        run: |
          running=$(aws lambda get-function --function-name "$PETBOT_REGRESSION_FUNCTION" \
            --query 'Code.ResolvedImageUri' --output text)
          running="${running##*@}"
          if [ -z "$EXPECTED" ] || [ "$running" != "$EXPECTED" ]; then
            echo "::error::$PETBOT_REGRESSION_FUNCTION runs $running, not this run's image ($EXPECTED): another deploy replaced it. Re-run this workflow."
            exit 1
          fi
          echo "$PETBOT_REGRESSION_FUNCTION runs this run's image ($running)."

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # The grader checks replies against the Discord frontend's fallback reply.
      - name: Sync (all extras)
        run: uv sync --locked --all-extras --python 3.12

      # Each case runs PETBOT_REGRESSION_TRIALS times (default 3) and passes only if all do.
      - name: Regression suite
        run: uv run pytest tests/regression -v -p no:cacheprovider

      # The suite writes each case's trials passed and tool calls observed; exception text
      # stays in the Regression suite step's log.
      - name: Summary
        if: always()
        run: |
          if [ -s "$PETBOT_REGRESSION_SUMMARY" ]; then
            cat "$PETBOT_REGRESSION_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Regression suite on \`$PETBOT_REGRESSION_FUNCTION\`: no results; see the Regression suite step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
