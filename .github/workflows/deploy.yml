name: Deploy

# Build + push the core worker image (arm64) and the edge image (amd64) to ECR,
# then terraform apply — entirely from CI via GitHub OIDC (no static AWS keys).
# The Lightsail edge pulls its image from ECR (private-registry access). See
# deploy/terraform/README.md. A push to main deploys `production` (the prod stage), whose
# deploy role trusts only jobs in that environment (which admits only main). A pull request
# from this repository that changes the core deploys to `dev` (or a manual run picks it): that commit's core,
# alone (no edge), into its own stack with its own deploy role, and the `test` job then runs
# the live suite (tests/live) against it, as the pull request's check (see docs/adr/0014).
# Each stage's settings are code (deploy/terraform/stages/<stage>.tfvars). The root of trust
# itself is applied by bootstrap.yml. Actions are pinned to commit SHAs: these jobs hold AWS
# credentials.
on:
  # Every pull request, so its `deploy` and `test` checks always report, as main's required
  # checks must: a workflow skipped by a paths filter leaves them pending, blocking the
  # merge, while a skipped job reports success. The gate job skips the deploy instead.
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy: production (main only) or dev (any branch, core only)."
        type: choice
        options: [production, dev]
        default: production
      rotate_edge_key:
        description: Replace the edge's AWS access key now, instead of on its schedule
        type: boolean
        default: false
  push:
    branches: [main]

# OIDC: request a short-lived token to assume the AWS deploy role.
permissions:
  id-token: write
  contents: read

# One run per environment at a time, held from deploy to test, so no other deploy to the
# same stage lands between a run's deploy and its tests. GitHub keeps only the newest
# waiting run of a group: when several pull requests queue for dev, an older waiting one is
# cancelled and its check shows that; re-run it. A fork's or Dependabot's pull request never
# deploys, so it runs in a group of its own and can't displace a waiting run.
concurrency:
  group: >-
    deploy-${{ inputs.environment || (github.event_name != 'pull_request' && 'production')
    || ((github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
    && format('untrusted-{0}', github.run_id) || 'dev') }}
  cancel-in-progress: false

jobs:
  # Whether to deploy at all. A push that changes the root of trust deploys only once
  # bootstrap.yml has applied it: this stack's deploy role may not exist yet, or may lack a
  # permission the change adds. bootstrap.yml starts this workflow when its apply is done
  # (or had nothing to apply), so here such a push steps aside instead of racing it (the
  # paths are bootstrap.yml's). A pull request that changes nothing the core is built,
  # configured or live-tested from has nothing to deploy to dev, so it skips too.
  gate:
    runs-on: ubuntu-latest
    outputs:
      defer: ${{ steps.paths.outputs.defer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0

      - name: Does this change need a deploy?
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          defer=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "${BEFORE//0/}" ] \
            && [ -n "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- deploy/terraform/bootstrap .github/workflows/bootstrap.yml)" ]; then
            defer=true
            echo "::notice::This push changes bootstrap: production deploys when bootstrap.yml has applied it."
          fi
          # A pull request's checkout is its merge commit, whose first parent is the base.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] \
            && [ -z "$(git diff --name-only HEAD^1 HEAD -- src conversations tests/live deploy pyproject.toml uv.lock .github/workflows/deploy.yml .github/scripts)" ]; then
            defer=true
            echo "::notice::Nothing the core is built, configured or live-tested from changed: no dev deploy."
          fi
          echo "defer=$defer" >> "$GITHUB_OUTPUT"

  # A pull request from a fork, or Dependabot's, gets no OIDC token or secrets, so it can't
  # deploy or test on AWS; say so instead of failing.
  untrusted:
    if: >-
      github.event_name == 'pull_request'
      && (github.event.pull_request.head.repo.full_name != github.repository
          || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Live tests skipped. A pull request from a fork or Dependabot can't reach AWS; a maintainer's branch is tested on the dev core."

  deploy:
    needs: gate
    if: >-
      needs.gate.outputs.defer != 'true'
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]'))
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      # The core image this run built, which the test job checks is what dev runs.
      worker_digest: ${{ steps.worker.outputs.digest }}
    # arm64 runner matches the worker Lambda's Graviton architecture, so that
    # image builds natively; the smaller edge image cross-builds for amd64 via
    # QEMU (cheaper to emulate than the heavy worker image).
    runs-on: ubuntu-24.04-arm
    # Each deploy role's trust names its environment. `production` admits only main and
    # needs a required reviewer's approval, so a merge alone ships nothing; a push always
    # deploys there. `dev` is created by the first run that references it, with no rules.
    environment: ${{ inputs.environment || (github.event_name == 'pull_request' && 'dev' || 'production') }}
    env:
      TF_DIR: deploy/terraform
      DEPLOY_ENV: ${{ inputs.environment || (github.event_name == 'pull_request' && 'dev' || 'production') }}
      # AWS_REGION is a repository variable (bootstrap.yml reads it too). The state bucket
      # carries the account ID, so it is a secret, which the public log masks; a variable of
      # the same name stands in while no secret is set, unmasked.
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
      # build-push-action otherwise uploads each build's record as a run artifact and writes
      # a build summary, both naming the ECR image, whose host carries the account ID; the
      # log is masked, but an artifact is not, and the repository is public.
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each environment's stage: its resource prefix and deploy role (bootstrap's
      # var.environments names the same), its state and its settings file. Terraform reads
      # the settings for every command through TF_CLI_ARGS_<command>.
      - name: Stage
        id: stage
        run: |
          case "$DEPLOY_ENV" in
            production) stage=prod ;;
            dev) stage=dev ;;
            *) echo "::error::Unknown environment: $DEPLOY_ENV"; exit 1 ;;
          esac
          {
            echo "STAGE=$stage"
            echo "TF_STATE_KEY=petbot-$stage/terraform.tfstate"
            echo "TF_VAR_name_prefix=petbot-$stage"
            echo "TF_CLI_ARGS_apply=-var-file=stages/$stage.tfvars"
            echo "TF_CLI_ARGS_console=-var-file=stages/$stage.tfvars"
          } >> "$GITHUB_ENV"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Deploy role
        env:
          ROLE_ARN_SECRET: ${{ secrets.DEPLOY_ROLE_ARN }}
        run: bash .github/scripts/deploy-role.sh "petbot-github-deploy-$STAGE"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          # The log is public: mask the account ID in every ARN, URL and name after this.
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Image tag (short git SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Edge
        working-directory: ${{ env.TF_DIR }}
        run: echo "EDGE=$(echo 'var.edge_enabled' | terraform console)" >> "$GITHUB_ENV"

      # A stage's own parameters that already exist read themselves rather than the
      # parameter they were copied from (parameters.tf), so a deleted source can't break a
      # later deploy. Names only: no value is read here.
      - name: Existing owned parameters
        working-directory: ${{ env.TF_DIR }}
        run: |
          names=$(echo 'join(",", keys(var.ssm_parameters))' | terraform console | tr -d '"')
          existing="[]"
          if [ -n "$names" ]; then
            existing=$(aws ssm describe-parameters \
              --parameter-filters "Key=Name,Option=Equals,Values=$names" \
              --query 'Parameters[].Name' --output json)
          fi
          echo "TF_VAR_existing_ssm_parameters=$(jq -c . <<< "$existing")" >> "$GITHUB_ENV"

      # buildx for the gha layer cache; QEMU for the amd64 edge build on arm.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.EDGE == 'true'

      # The function is pinned to its image digest, and the edge service must grant
      # ECR-pull access before the deployment is created — so stand up the two ECR
      # repos, the Lightsail service, and the edge repo policy first (idempotent). A stack
      # without the edge needs only the core's repo.
      - name: Ensure registries + edge service exist
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "$EDGE" = true ]; then
            terraform apply -auto-approve \
              -target=aws_ecr_repository.this \
              -target=aws_ecr_repository.edge \
              -target=aws_lightsail_container_service.edge \
              -target=aws_ecr_repository_policy.edge
            echo "EDGE_ECR_REPO=$(terraform output -raw edge_ecr_repository_url)" >> "$GITHUB_ENV"
          else
            terraform apply -auto-approve -target=aws_ecr_repository.this
          fi
          echo "ECR_REPO=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"

      - name: ECR login
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"

      - name: Build & push core worker image (arm64)
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.lambda
          platforms: linux/arm64
          tags: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          push: true
          # provenance=false: buildx otherwise pushes an OCI image *index*, which
          # Lambda rejects; this pushes a single image manifest Lambda accepts.
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build & push edge image (amd64)
        if: env.EDGE == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.edge
          platforms: linux/amd64
          tags: ${{ env.EDGE_ECR_REPO }}:${{ env.IMAGE_TAG }}
          push: true
          provenance: false
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

      # Terraform prints each resource's id as it refreshes or creates it, and the edge's
      # access key id is one; the log is public, so access key ids are redacted from it.
      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          # Empty on a push, so a push never rotates; see edge.tf for the replacement order.
          ROTATE_EDGE_KEY: ${{ inputs.rotate_edge_key }}
        run: |
          set -o pipefail
          replace=()
          if [ "$ROTATE_EDGE_KEY" = "true" ]; then
            if [ "$EDGE" != true ]; then
              echo "::error::rotate_edge_key: the $STAGE stage runs no edge, so it has no edge key to replace."
              exit 1
            fi
            replace=(-replace='aws_iam_access_key.edge[0]')
          fi
          terraform apply -auto-approve "${replace[@]}" \
            -var "image_tag=$IMAGE_TAG" \
            -var "edge_image_tag=$IMAGE_TAG" 2>&1 \
            | sed -u -E 's/(AKIA|ASIA)[A-Z0-9]{16}/\1****************/g'

      - name: Show outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform output -raw core_function_arn; echo
          if [ "$EDGE" = true ]; then terraform output -raw edge_container_service_name; echo; fi

  # Every deploy to dev (each pull request from this repository, or a manual dev run) is
  # tested live: tests/live runs against petbot-dev-core, dispatched as the Discord
  # frontend dispatches, as the dev deploy role. Its result is this job's check on the pull
  # request, and the transcripts go to the run's summary. The run holds the dev slot from
  # deploy to here (the workflow's concurrency group), and the first step proves the
  # function runs this run's image, so the tests can't run against another deploy.
  test:
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.stage == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    env:
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
      PETBOT_LIVE_FUNCTION: petbot-dev-core
      PETBOT_LIVE_TRANSCRIPTS: live-transcripts.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy role
        env:
          ROLE_ARN_SECRET: ${{ secrets.DEPLOY_ROLE_ARN }}
        run: bash .github/scripts/deploy-role.sh petbot-github-deploy-dev

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: The dev core runs this run's image
        env:
          EXPECTED: ${{ needs.deploy.outputs.worker_digest }}
        run: |
          running=$(aws lambda get-function --function-name "$PETBOT_LIVE_FUNCTION" \
            --query 'Code.ResolvedImageUri' --output text)
          running="${running##*@}"
          if [ -z "$EXPECTED" ] || [ "$running" != "$EXPECTED" ]; then
            echo "::error::$PETBOT_LIVE_FUNCTION runs $running, not this run's image ($EXPECTED): another deploy replaced it. Re-run this workflow."
            exit 1
          fi
          echo "$PETBOT_LIVE_FUNCTION runs this run's image ($running)."

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # The conversation tests reuse the Discord frontend's rendering and history code.
      - name: Sync (all extras)
        run: uv sync --locked --all-extras --python 3.12

      - name: Live tests
        run: |
          set -o pipefail
          uv run pytest tests/live -v -p no:cacheprovider 2>&1 | tee live.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Live tests on \`$PETBOT_LIVE_FUNCTION\`"
            echo
            echo '```text'
            grep -E '(PASSED|FAILED|ERROR|SKIPPED)( |$)|^=+ .* =+$' live.log || echo "No test output."
            echo '```'
            echo
            cat "$PETBOT_LIVE_TRANSCRIPTS" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
