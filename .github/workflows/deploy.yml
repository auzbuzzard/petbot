name: Deploy

# Build + push the core worker image (arm64) and the edge image (amd64) to ECR,
# then terraform apply — entirely from CI via GitHub OIDC (no static AWS keys).
# The Lightsail edge pulls its image from ECR (private-registry access). See
# deploy/terraform/README.md. A push to main deploys `production`, whose deploy role
# trusts only jobs in that environment (which admits only main). A manual run may pick
# `dev` instead: the dispatched branch's core, alone (no edge), into its own stack with
# its own deploy role, to talk to through the chat harness before it merges (see
# docs/adr/0014). The root of trust itself is applied by bootstrap.yml. Actions are
# pinned to commit SHAs: this job holds AWS credentials.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy: production (main only) or dev (any branch, core only)."
        type: choice
        options: [production, dev]
        default: production
  push:
    branches: [main]

# OIDC: request a short-lived token to assume the AWS deploy role.
permissions:
  id-token: write
  contents: read

# One deploy per environment at a time: two branches deployed to dev take turns.
concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    # arm64 runner matches the worker Lambda's Graviton architecture, so that
    # image builds natively; the smaller edge image cross-builds for amd64 via
    # QEMU (cheaper to emulate than the heavy worker image).
    runs-on: ubuntu-24.04-arm
    # Each deploy role's trust names its environment. `production` admits only main and
    # needs a required reviewer's approval, so a merge alone ships nothing; a push always
    # deploys there.
    environment: ${{ inputs.environment || 'production' }}
    env:
      TF_DIR: deploy/terraform
      DEPLOY_ENV: ${{ inputs.environment || 'production' }}
      # Deploy config, read by Terraform as TF_VAR_*; secret *values* stay in SSM,
      # referenced by name. AWS_REGION is a repository variable (bootstrap.yml reads it
      # too); the rest are the deploy environment's. The state bucket and the role
      # ARN carry the account ID, so they are read as secrets, which the public log masks;
      # a variable of the same name stands in while no secret is set, unmasked.
      # Job-level, because only a job that references an environment sees its variables.
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_chat_llm_kind: ${{ vars.CHAT_LLM_KIND }}
      TF_VAR_chat_llm_model: ${{ vars.CHAT_LLM_MODEL }}
      TF_VAR_chat_llm_base_url: ${{ vars.CHAT_LLM_BASE_URL }}
      TF_VAR_chat_llm_api_key_ssm_parameter: ${{ vars.CHAT_LLM_API_KEY_SSM_PARAMETER }}
      # Optional: the web_search tool's Tavily key (unset => keyless ddgs search only).
      TF_VAR_tavily_api_key_ssm_parameter: ${{ vars.TAVILY_API_KEY_SSM_PARAMETER }}
      # Observability (off unless OBSERVABILITY_ENABLED is set to "true"). The `|| 'default'`
      # fallbacks matter: an unset GitHub Variable renders as an empty string, and Terraform
      # would reject "" for a bool/number var — so an unset Variable resolves to the
      # variable's default.
      TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED || 'false' }}
      TF_VAR_observability_sample_ratio: ${{ vars.OBSERVABILITY_SAMPLE_RATIO || '1.0' }}
      TF_VAR_telemetry_id_salt_ssm_parameter: ${{ vars.TELEMETRY_ID_SALT_SSM_PARAMETER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Each environment's stack: its resource prefix (bootstrap's var.environments names
      # the same one, which its deploy role is scoped to), its state, and whether it runs
      # the edge. Production's is the stack as it always was: petbot, petbot/terraform.tfstate.
      - name: Environment
        run: |
          case "$DEPLOY_ENV" in
            production) prefix=petbot; edge=true; lambda_env=prod ;;
            dev) prefix=petbot-dev; edge=false; lambda_env=dev ;;
            *) echo "::error::Unknown environment: $DEPLOY_ENV"; exit 1 ;;
          esac
          {
            echo "TF_STATE_KEY=$prefix/terraform.tfstate"
            echo "TF_VAR_name_prefix=$prefix"
            echo "TF_VAR_edge_enabled=$edge"
            echo "TF_VAR_lambda_environment=$lambda_env"
            echo "EDGE=$edge"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN || vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # The log is public: mask the account ID in every ARN, URL and name after this.
          mask-aws-account-id: true

      # buildx for the gha layer cache; QEMU for the amd64 edge build on arm.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: env.EDGE == 'true'

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.11.4"

      - name: Image tag (short git SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # The function is pinned to its image digest, and the edge service must grant
      # ECR-pull access before the deployment is created — so stand up the two ECR
      # repos, the Lightsail service, and the edge repo policy first (idempotent). A stack
      # without the edge needs only the core's repo.
      - name: Ensure registries + edge service exist
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "$EDGE" = true ]; then
            terraform apply -auto-approve \
              -target=aws_ecr_repository.this \
              -target=aws_ecr_repository.edge \
              -target=aws_lightsail_container_service.edge \
              -target=aws_ecr_repository_policy.edge
            echo "EDGE_ECR_REPO=$(terraform output -raw edge_ecr_repository_url)" >> "$GITHUB_ENV"
          else
            terraform apply -auto-approve -target=aws_ecr_repository.this
          fi
          echo "ECR_REPO=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"

      - name: ECR login
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"

      - name: Build & push core worker image (arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.lambda
          platforms: linux/arm64
          tags: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          push: true
          # provenance=false: buildx otherwise pushes an OCI image *index*, which
          # Lambda rejects; this pushes a single image manifest Lambda accepts.
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build & push edge image (amd64)
        if: env.EDGE == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.edge
          platforms: linux/amd64
          tags: ${{ env.EDGE_ECR_REPO }}:${{ env.IMAGE_TAG }}
          push: true
          provenance: false
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

      # Terraform prints each resource's id as it refreshes or creates it, and the edge's
      # access key id is one; the log is public, so access key ids are redacted from it.
      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -o pipefail
          terraform apply -auto-approve \
            -var "image_tag=$IMAGE_TAG" \
            -var "edge_image_tag=$IMAGE_TAG" 2>&1 \
            | sed -u -E 's/(AKIA|ASIA)[A-Z0-9]{16}/\1****************/g'

      - name: Show outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform output -raw core_function_arn; echo
          if [ "$EDGE" = true ]; then terraform output -raw edge_container_service_name; echo; fi
