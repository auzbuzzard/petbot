name: Claude Code Review

# On demand: a review runs when the `claude-review` label is added to a pull request.
on:
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    # Skip Dependabot PRs: they're mechanical dependency bumps where AI review
    # adds little, and Dependabot runs can't read Actions secrets anyway (they
    # use a separate Dependabot secret store), so the review would fail at auth.
    if: >-
      github.event.label.name == 'claude-review'
      && github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

