name: Legacy stack

# Operates the pre-migration production stack (name_prefix petbot, state
# petbot/terraform.tfstate) from code until it is gone (docs/adr/0014, "Migrating
# production"). deploy/terraform/stages/legacy.tfvars says what it should be, and a change
# to it merged to main runs this:
#
#   edge_paused = true | false   pause or resume its edge (a targeted apply of the
#                                Lightsail service: its containers stop or start)
#   retired     = true           destroy the stack, then delete its retired_parameters
#                                (made outside Terraform) and its state
#
# Two jobs, each run as the legacy deploy role from the `production` environment, so each
# waits for a required reviewer. Approving `plan` changes nothing: it plans and lists the
# plan's resource changes in the run's summary. Read them, then approve `apply`, which plans
# again and applies only if that plan is the one reviewed (the same resource changes); if
# anything changed since, it fails and the workflow is re-run. Reject `apply` to change
# nothing. This workflow and the legacy role go once the stack is destroyed.
on:
  push:
    branches: [main]
    paths:
      - "deploy/terraform/stages/legacy.tfvars"
      - ".github/workflows/legacy.yml"
      - ".github/scripts/legacy-plan.sh"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: legacy
  cancel-in-progress: false

env:
  TF_DIR: deploy/terraform
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_name_prefix: petbot
  TF_CLI_ARGS_plan: -var-file=stages/legacy.tfvars
  TF_CLI_ARGS_console: -var-file=stages/legacy.tfvars

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production
    env:
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
    outputs:
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy role
        env:
          ROLE_ARN_SECRET: ${{ secrets.DEPLOY_ROLE_ARN }}
        run: bash .github/scripts/deploy-role.sh petbot-github-deploy

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=petbot/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/legacy-plan.sh"

      # Addresses and actions only: the full plan is in the log above.
      - name: Summarise the plan for review
        working-directory: ${{ env.TF_DIR }}
        run: |
          resources=$(terraform show -json legacy.tfplan \
            | jq -r '(.resource_changes // [])[]
                | select(.change.actions != ["no-op"] or .previous_address)
                | "- `\(.address)`: \(.change.actions | join(", "))\(if .previous_address then " (moved from `\(.previous_address)`)" else "" end)"')
          {
            echo "### Legacy stack plan ($([ "$RETIRED" = true ] && echo destroy || echo edge))"
            echo
            echo "Plan digest: \`$DIGEST\`. Approve the \`apply\` job only if these are the changes you expect."
            echo
            echo "${resources:-No changes.}"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # Required reviewer: the run waits here until approved, after the plan was posted.
    environment: production
    env:
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy role
        env:
          ROLE_ARN_SECRET: ${{ secrets.DEPLOY_ROLE_ARN }}
        run: bash .github/scripts/deploy-role.sh petbot-github-deploy

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=petbot/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan again
        working-directory: ${{ env.TF_DIR }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/legacy-plan.sh"

      - name: Apply (the reviewed plan)
        working-directory: ${{ env.TF_DIR }}
        env:
          REVIEWED_DIGEST: ${{ needs.plan.outputs.digest }}
        run: |
          if [ "$DIGEST" != "$REVIEWED_DIGEST" ]; then
            echo "::error::The plan changed since it was reviewed ($REVIEWED_DIGEST, now $DIGEST). Re-run the workflow and review the new plan."
            exit 1
          fi
          set -o pipefail
          terraform apply -input=false -lock-timeout=120s legacy.tfplan 2>&1 \
            | sed -u -E 's/(AKIA|ASIA)[A-Z0-9]{16}/\1****************/g'

      # After the destroy: the parameters it read (made outside Terraform) and its state.
      - name: Remove its parameters and state
        if: env.RETIRED == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: |
          names=$(echo 'join(" ", var.retired_parameters)' | terraform console | tr -d '"')
          if [ -n "$names" ]; then
            # shellcheck disable=SC2086 # one argument per parameter name
            aws ssm delete-parameters --names $names
          fi
          aws s3 rm "s3://$STATE_BUCKET/petbot/terraform.tfstate"
