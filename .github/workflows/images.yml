name: Images

# The edge image: the dev stage runs no edge, so this is a pull request's only check that it
# builds. deploy.yml builds the core worker image. No AWS credentials or registry access.
on:
  push:
    branches: [main]
    paths:
      - "deploy/Dockerfile.edge"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "deploy/Dockerfile.edge"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - ".github/workflows/images.yml"

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    name: Build edge image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.edge
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
