name: Bootstrap

# Applies deploy/terraform/bootstrap, the root of trust: the CI roles, the workload
# boundary, the operator's access and the state bucket. A change merged to main is
# planned with a read-only role and posted to the run's summary; the apply job waits for
# a required reviewer to approve the `bootstrap` environment, plans again, and applies only
# if that plan is the one reviewed (same resource changes). Each job assumes its role from
# its environment, and both environments admit only main, so no branch, pull request or
# other workflow can reach these roles. See deploy/terraform/README.md "Bootstrap".
#
# The plan is in the run's log and summary, which are public like the repository: it
# shows what the code in this directory already shows, plus the account ID. No plan file
# or state leaves the runner.
on:
  push:
    branches: [main]
    paths:
      - "deploy/terraform/bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

env:
  TF_DIR: deploy/terraform/bootstrap
  TF_IN_AUTOMATION: "true"
  # Repository variables (both environments read them), not environment ones.
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  # The backend, once for both jobs: terraform adds these to every `terraform init`.
  TF_CLI_ARGS_init: >-
    -input=false
    -backend-config=bucket=${{ vars.TF_STATE_BUCKET }}
    -backend-config=key=bootstrap/terraform.tfstate
    -backend-config=region=${{ vars.AWS_REGION }}
    -backend-config=encrypt=true
    -backend-config=use_lockfile=true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: bootstrap-plan
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - name: Check repository variables
        run: |
          for name in AWS_REGION TF_STATE_BUCKET BOOTSTRAP_PLAN_ROLE_ARN; do
            [ -n "${!name}" ] || { echo "::error::$name is unset (AWS_REGION and TF_STATE_BUCKET are repository variables; BOOTSTRAP_PLAN_ROLE_ARN is bootstrap-plan's)"; exit 1; }
          done
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          BOOTSTRAP_PLAN_ROLE_ARN: ${{ vars.BOOTSTRAP_PLAN_ROLE_ARN }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.BOOTSTRAP_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      # -detailed-exitcode: 0 = no changes, 2 = changes; anything else is a failure. The
      # digest identifies the plan's resource changes, so the apply job can check it
      # applies the plan that was reviewed.
      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          terraform plan -no-color -lock-timeout=120s -detailed-exitcode -out=bootstrap.tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          case "$code" in
            0) changes=false ;;
            2) changes=true ;;
            *) echo "::error::terraform plan exited $code"; exit 1 ;;
          esac
          digest=$(terraform show -json bootstrap.tfplan | jq -S '.resource_changes' | sha256sum | cut -d' ' -f1)
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Bootstrap plan"
            echo "Plan digest: \`$digest\`"
            limit=900000
            if [ "$(wc -c < plan.txt)" -gt "$limit" ]; then
              echo "> [!WARNING]"
              echo "> The plan is longer than the summary allows and is cut off below. Read it in full in the **Terraform plan** step's log before approving."
            fi
            echo '```'
            head -c "$limit" plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # Required reviewer: the run waits here until approved.
    environment: bootstrap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.BOOTSTRAP_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      # Plan again under the state lock and apply only if it is the plan that was
      # reviewed: if anything changed since (the state, the account), re-run the workflow
      # and review the new plan.
      - name: Terraform apply (the reviewed plan)
        working-directory: ${{ env.TF_DIR }}
        env:
          REVIEWED_DIGEST: ${{ needs.plan.outputs.digest }}
        run: |
          terraform plan -no-color -lock-timeout=120s -out=bootstrap.tfplan
          digest=$(terraform show -json bootstrap.tfplan | jq -S '.resource_changes' | sha256sum | cut -d' ' -f1)
          if [ "$digest" != "$REVIEWED_DIGEST" ]; then
            echo "::error::The plan changed since it was reviewed ($REVIEWED_DIGEST, now $digest). Re-run the workflow and review the new plan."
            exit 1
          fi
          terraform apply -no-color -lock-timeout=120s bootstrap.tfplan
