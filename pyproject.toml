[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot"
version = "2.1.0"
description = "A Discord bot: a thin gateway edge that dispatches to skill workers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Base install is the shared kernel only. The runtime dependencies of each
# deployable live in an extra below, so a process installs just what it runs
# (the edge never pulls pydantic-ai; a worker never pulls discord.py).
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
# The always-on gateway edge: holds the Discord connection, dispatches to a
# worker over HTTP (or a Lambda, with the `lambda` extra).
edge = [
    "discord.py>=2.7,<2.8",
    "httpx>=0.27",
    "pydantic-settings>=2.14.2",
]
# The core worker: math + booru search + the chat agent.
worker-core = [
    "httpx>=0.27",
    "pydantic-settings>=2.14.2",
    "numexpr>=2.8",
    "numpy>=1.26",
    "pydantic-ai-slim[bedrock,openai]>=0.0.30",
]
# The music worker: its own gateway plus voice playback.
worker-music = [
    "discord.py[voice]>=2.7,<2.8",
    "yt-dlp>=2024.0.0",
    "pydantic-settings>=2.14.2",
]
# Dispatch to a Lambda worker (boto3) — used by the edge in production.
lambda = ["boto3>=1.34"]
# Everything, for development and CI (so type-check and tests see all code).
dev = [
    "petbot[edge,worker-core,worker-music,lambda]",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.7",
]

[project.scripts]
petbot-edge = "petbot.edge.__main__:main"
petbot-core = "petbot.workers.core.__main__:main"
petbot-music = "petbot.workers.music.__main__:main"

# Skills are discovered at runtime from this entry-point group.
[project.entry-points."petbot.skills"]
math = "petbot.skills.math:MathSkill"
derpi = "petbot.skills.booru:build_derpi"
e621 = "petbot.skills.booru:build_e621"

[tool.setuptools.packages.find]
where = ["src"]
include = ["petbot*"]

[tool.setuptools.package-data]
"petbot" = ["py.typed"]
"petbot.skills.booru" = ["utterances.json"]
"petbot.logging_configs" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["petbot"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
# The root tests/conftest.py shares a module name with the package-local booru
# conftest; it is trivial env setup, so keep it out of the type graph.
exclude = ["tests/conftest\\.py$"]

[[tool.mypy.overrides]]
module = ["numexpr.*", "yt_dlp.*", "nacl.*", "boto3.*", "conftest"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    # Live-connection bootstraps are smoke-tested manually, not in CI.
    "src/petbot/edge/bot.py",
    "src/petbot/edge/__main__.py",
    "src/petbot/workers/core/__main__.py",
    "src/petbot/workers/music/bot.py",
    "src/petbot/workers/music/voice.py",
    "src/petbot/workers/music/__main__.py",
]

# import-linter: enforce the one-way layering kernel -> types -> platform -> {skills, edge}.
[tool.importlinter]
root_packages = ["petbot"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain kernel depends on nothing else first-party and no platform SDK"
type = "forbidden"
source_modules = ["petbot.domain"]
forbidden_modules = ["petbot.types", "petbot.platform", "petbot.skills", "petbot.edge", "discord", "httpx"]

[[tool.importlinter.contracts]]
name = "The typed surface depends only on the kernel"
type = "forbidden"
source_modules = ["petbot.types"]
forbidden_modules = ["petbot.platform", "petbot.skills", "petbot.edge", "discord"]

[[tool.importlinter.contracts]]
name = "The platform must not import a skill or the edge"
type = "forbidden"
source_modules = ["petbot.platform"]
forbidden_modules = ["petbot.skills", "petbot.edge", "discord"]

[[tool.importlinter.contracts]]
name = "The edge dispatches to workers and never imports a skill"
type = "forbidden"
source_modules = ["petbot.edge"]
forbidden_modules = ["petbot.skills"]
