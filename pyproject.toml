[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot"
version = "2.0.0"
description = "A modern, slash-command-first Discord bot with a platform-neutral core."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.7,<2.8",
    "aiohttp>=3.9",
    "pydantic>=2",
    "yt-dlp>=2024.0.0",
    "numexpr>=2.8",
    "numpy>=1.26",
    "certifi>=2024.0.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[project.scripts]
petbot = "petbot.__main__:main"

[tool.setuptools.packages.find]
include = ["petbot*"]

[tool.setuptools.package-data]
"petbot.core.capabilities.boorus" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["petbot", "tests"]
# discord.py and third-party libs ship their own types or are ignored below.

[[tool.mypy.overrides]]
module = ["numexpr.*", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=petbot --cov-report=term-missing"

[tool.coverage.run]
omit = [
    # The Discord gateway bootstrap requires a live connection; it is smoke-tested
    # manually against a dev guild rather than in CI.
    "petbot/frontends/discord/bootstrap.py",
    "petbot/__main__.py",
]

# import-linter: enforce the one-way core -> adapter dependency rule.
[tool.importlinter]
root_packages = ["petbot"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The neutral core must not depend on any frontend/adapter"
type = "forbidden"
source_modules = ["petbot.core"]
forbidden_modules = ["petbot.frontends"]

[[tool.importlinter.contracts]]
name = "The neutral core must not import discord"
type = "forbidden"
source_modules = ["petbot.core"]
forbidden_modules = ["discord"]
