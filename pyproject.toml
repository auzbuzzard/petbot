[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The workspace root is an umbrella: it owns no code, it just pulls in every
# member (editable) for dev + CI and holds the shared tooling config. Each member
# is an independently-installable dist under the `petbot.*` namespace (PEP 420),
# so the edge and a worker each install only what they need.
[project]
name = "petbot"
version = "2.1.0"
description = "A modern Discord bot: a thin always-on edge dispatching to skill workers (A3a)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "petbot-domain",
    "petbot-types",
    "petbot-platform",
    "petbot-skill-math",
    "petbot-skill-booru",
    "petbot-skill-music",
    "petbot-skill-chat",
    "petbot-discord",
    "petbot-worker-brain",
    "petbot-worker-music",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.7",
]

# The umbrella ships no modules of its own.
[tool.setuptools]
packages = []

[tool.uv.workspace]
members = ["domain", "types", "platform", "skills/math", "skills/booru", "skills/music", "skills/chat", "frontends/discord", "workers/brain", "workers/music"]

[tool.uv.sources]
petbot-domain = { workspace = true }
petbot-types = { workspace = true }
petbot-platform = { workspace = true }
petbot-skill-math = { workspace = true }
petbot-skill-booru = { workspace = true }
petbot-skill-music = { workspace = true }
petbot-skill-chat = { workspace = true }
petbot-discord = { workspace = true }
petbot-worker-brain = { workspace = true }
petbot-worker-music = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["petbot"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "domain:types:platform:skills/math:skills/booru:skills/music:skills/chat:frontends/discord:workers/brain:workers/music"
files = ["domain", "types", "platform", "skills", "frontends", "workers"]

[[tool.mypy.overrides]]
module = ["numexpr.*", "yt_dlp.*", "nacl.*", "boto3.*"]
ignore_missing_imports = true

# Test helpers are imported by file name (pytest's rootdir-relative `conftest`),
# which mypy can't resolve as a package; the modules themselves are still checked.
[[tool.mypy.overrides]]
module = ["conftest"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "domain/tests",
    "types/tests",
    "platform/tests",
    "skills/math/tests",
    "skills/booru/tests",
    "skills/music/tests",
    "skills/chat/tests",
    "frontends/discord/tests",
    "workers/brain/tests",
    "workers/music/tests",
]

# import-linter: enforce the package dependency rules of the A3a layering. The
# leaf packages are listed explicitly because grimp cannot walk a bare PEP 420
# namespace (`petbot`) that is spread across several editable installs.
[tool.importlinter]
root_packages = [
    "petbot.domain",
    "petbot.types",
    "petbot.platform",
    "petbot.skills.math",
    "petbot.skills.booru",
    "petbot.skills.music",
    "petbot.skills.chat",
    "petbot.discord",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain Shared Kernel depends on nothing first-party or platform"
type = "forbidden"
source_modules = ["petbot.domain"]
forbidden_modules = [
    "petbot.types",
    "petbot.platform",
    "petbot.skills.math",
    "petbot.skills.booru",
    "petbot.skills.music",
    "petbot.skills.chat",
    "discord",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "The typed surface depends only on the kernel"
type = "forbidden"
source_modules = ["petbot.types"]
forbidden_modules = [
    "petbot.platform",
    "petbot.skills.math",
    "petbot.skills.booru",
    "petbot.skills.music",
    "petbot.skills.chat",
    "discord",
]

[[tool.importlinter.contracts]]
name = "The platform must not import a skill or a frontend"
type = "forbidden"
source_modules = ["petbot.platform"]
forbidden_modules = [
    "petbot.skills.math",
    "petbot.skills.booru",
    "petbot.skills.music",
    "petbot.skills.chat",
    "discord",
]

[[tool.importlinter.contracts]]
name = "The edge dispatches to workers; it never imports a skill"
type = "forbidden"
source_modules = ["petbot.discord"]
forbidden_modules = [
    "petbot.skills.math",
    "petbot.skills.booru",
    "petbot.skills.music",
    "petbot.skills.chat",
]
