[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot"
version = "2.0.0"
description = "A modern, slash-command-first Discord bot with a platform-neutral core."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Base install: the lean, serverless-portable core the HTTP-Interactions Lambda
# runs. The Discord gateway and music are opt-in extras, never base deps, so the
# serverless image carries neither. `aiohttp`/`certifi` are intentionally
# absent: transitive (via discord.py and httpx), never imported directly. See
# AGENTS.md import map.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "numexpr>=2.8",        # /math skill (runs in the Lambda)
    "numpy>=1.26",         # numexpr backend
    # Used by pydantic-settings to read the optional local `.env` file.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The HTTP-Interactions frontend (AWS Lambda). PyNaCl verifies Discord's Ed25519
# request signatures. The only extra installed in the prod image.
# See docs/adr/0005-serverless-deployment.md.
interactions = [
    "pynacl>=1.5",
]
# The long-running Discord gateway bot (`python -m petbot`); not part of the
# serverless deployment.
discord = [
    "discord.py>=2.7,<2.8",
]
# Voice playback for the gateway's `/music`. Opt-in so its heavy media deps
# stay out of the base/Lambda install.
music = [
    "yt-dlp>=2024.0.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.7",
    "pynacl>=1.5",
    "discord.py>=2.7,<2.8",
    "yt-dlp>=2024.0.0",
]

[project.scripts]
petbot = "petbot.__main__:main"

# uv workspace members. `domain` is the Shared Kernel (depends on nothing).
[tool.uv.workspace]
members = ["domain", "skills/math"]

[tool.setuptools.packages.find]
include = ["petbot*"]

[tool.setuptools.package-data]
"petbot" = ["logging_configs/*.json"]
"petbot.core.capabilities.boorus" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

# First-party = every PetBot distribution, so the kernel/skills sort apart from
# true third-party deps (numexpr, httpx, …) in a multi-package workspace.
[tool.ruff.lint.isort]
known-first-party = ["petbot", "petbot_domain", "petbot_skill_math"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["petbot", "domain", "skills", "tests"]
# discord.py and third-party libs ship their own types or are ignored below.

[[tool.mypy.overrides]]
module = ["numexpr.*", "yt_dlp.*", "nacl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "domain/tests", "skills/math/tests"]
addopts = "--cov=petbot --cov-report=term-missing"

[tool.coverage.run]
omit = [
    # The Discord gateway bootstrap requires a live connection; it is smoke-tested
    # manually against a dev guild rather than in CI.
    "petbot/frontends/discord/bootstrap.py",
    "petbot/__main__.py",
]

# import-linter: enforce the one-way core -> adapter dependency rule.
[tool.importlinter]
root_packages = ["petbot", "petbot_domain", "petbot_skill_math"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain Shared Kernel depends on nothing first-party or platform"
type = "forbidden"
source_modules = ["petbot_domain"]
forbidden_modules = ["petbot", "discord"]

[[tool.importlinter.contracts]]
name = "A skill depends only on the kernel — never a frontend, platform, or sibling skill"
type = "forbidden"
source_modules = ["petbot_skill_math"]
forbidden_modules = ["petbot", "discord"]

[[tool.importlinter.contracts]]
name = "The neutral core must not depend on any frontend/adapter"
type = "forbidden"
source_modules = ["petbot.core"]
forbidden_modules = ["petbot.frontends"]

[[tool.importlinter.contracts]]
name = "The neutral core must not import discord"
type = "forbidden"
source_modules = ["petbot.core"]
forbidden_modules = ["discord"]

[[tool.importlinter.contracts]]
name = "The interactions frontend must not import discord (stays serverless-portable)"
type = "forbidden"
source_modules = ["petbot.frontends.interactions"]
forbidden_modules = ["discord"]
