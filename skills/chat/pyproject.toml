[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-skill-chat"
version = "2.1.0"
description = "PetBot chat skill: the conversational LLM agent (pydantic-ai), tools = sibling skills."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "petbot-domain",
    "petbot-types",
    "pydantic>=2",
    "pydantic-settings>=2",
    # The agent framework. Bedrock (prod) and an OpenAI-compatible client
    # (OpenRouter, for dev) are both pulled in.
    "pydantic-ai-slim[bedrock,openai]>=0.0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["petbot.skills.chat*"]
namespaces = true

[tool.setuptools.package-data]
"petbot.skills.chat" = ["py.typed"]

[tool.uv.sources]
petbot-domain = { workspace = true }
petbot-types = { workspace = true }
