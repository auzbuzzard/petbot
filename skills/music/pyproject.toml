[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-skill-music"
version = "2.1.0"
description = "PetBot music skill: neutral queue + skip-vote logic over a VoicePort."
requires-python = ">=3.12"
license = { text = "MIT" }
# Pure neutral logic — no audio deps here. The voice transport (yt-dlp/FFmpeg)
# lives in the music worker's adapter, behind the VoicePort.
dependencies = [
    "petbot-domain",
    "petbot-types",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["petbot.skills.music*"]
namespaces = true

[tool.setuptools.package-data]
"petbot.skills.music" = ["py.typed"]

[tool.uv.sources]
petbot-domain = { workspace = true }
petbot-types = { workspace = true }
