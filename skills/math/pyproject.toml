[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-skill-math"
version = "2.1.0"
description = "PetBot math skill: evaluate arithmetic with numexpr."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "petbot-domain",
    "petbot-types",
    "numexpr>=2.8",
    "numpy>=1.26",
]

[project.entry-points."petbot.skills"]
math = "petbot.skills.math:MathSkill"

[tool.setuptools.packages.find]
where = ["."]
include = ["petbot.skills.math*"]
namespaces = true

[tool.setuptools.package-data]
"petbot.skills.math" = ["py.typed"]

[tool.uv.sources]
petbot-domain = { workspace = true }
petbot-types = { workspace = true }
