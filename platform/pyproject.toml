[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-platform"
version = "2.1.0"
description = "PetBot platform: the worker runtime and the typed Skills client implementations."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "petbot-domain",
    "petbot-types",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
# The Lambda transport's AWS SDK; only the edge that dispatches to a Lambda
# worker needs it, so it stays an opt-in extra.
lambda = ["boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["."]
include = ["petbot.platform*"]
namespaces = true

[tool.setuptools.package-data]
"petbot.platform" = ["py.typed"]

[tool.uv.sources]
petbot-domain = { workspace = true }
petbot-types = { workspace = true }
