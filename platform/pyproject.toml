[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-platform"
version = "0.1.0"
description = "PetBot runtime: entry-point skill loader, registry, manifest, and dispatch adapters."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["petbot-domain"]

[tool.setuptools.packages.find]
include = ["petbot_platform*"]

[tool.setuptools.package-data]
"petbot_platform" = ["py.typed"]

[tool.uv.sources]
petbot-domain = { workspace = true }
