[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-worker-music"
version = "2.1.0"
description = "PetBot music worker: a Discord gateway + voice host behind a dispatch endpoint."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "petbot-domain",
    "petbot-platform",
    "petbot-skill-music",
    "discord.py[voice]>=2.7,<2.8",
    "yt-dlp>=2024.0.0",
    "pydantic-settings>=2",
]

[project.scripts]
petbot-music = "petbot.workers.music.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["petbot.workers.music*"]
namespaces = true

[tool.setuptools.package-data]
"petbot.workers.music" = ["py.typed"]

[tool.uv.sources]
petbot-domain = { workspace = true }
petbot-platform = { workspace = true }
petbot-skill-music = { workspace = true }
