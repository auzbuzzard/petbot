[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-domain"
version = "2.1.0"
description = "PetBot Shared Kernel: neutral domain models and port interfaces."
requires-python = ">=3.12"
license = { text = "MIT" }
# The Shared Kernel depends only on pydantic (the models serialise themselves).
# No utilities, HTTP clients, or adapters — that would make it a utility library,
# not a shared kernel. Enforced by import-linter.
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["petbot.domain*"]
namespaces = true

[tool.setuptools.package-data]
"petbot.domain" = ["py.typed"]
