[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-domain"
version = "0.1.0"
description = "PetBot Shared Kernel: neutral domain types and port interfaces."
requires-python = ">=3.12"
license = { text = "MIT" }
# The Shared Kernel: neutral models + ports. Pydantic (already the project's
# model library) makes the data self-serialising at the boundary; no other deps.
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
include = ["petbot_domain*"]

[tool.setuptools.package-data]
"petbot_domain" = ["py.typed"]
