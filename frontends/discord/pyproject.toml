[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petbot-discord"
version = "2.1.0"
description = "PetBot Discord edge: the always-on gateway that dispatches to skill workers."
requires-python = ">=3.12"
license = { text = "MIT" }
# The edge imports the typed surface + the client/transports — never a skill.
dependencies = [
    "petbot-domain",
    "petbot-types",
    "petbot-platform",
    "discord.py>=2.7,<2.8",
    "httpx>=0.27",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
# Dispatch to a Lambda worker (prod) needs the platform's boto3 transport.
lambda = ["petbot-platform[lambda]"]

[project.scripts]
petbot-edge = "petbot.discord.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["petbot.discord*"]
namespaces = true

[tool.setuptools.package-data]
"petbot.discord" = ["py.typed"]

[tool.uv.sources]
petbot-domain = { workspace = true }
petbot-types = { workspace = true }
petbot-platform = { workspace = true }
